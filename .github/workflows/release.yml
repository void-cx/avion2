name: Release

# Push a version tag to publish a release:  git tag v0.2.0 && git push origin v0.2.0
# The release carries AVION2-v<version>-win-x64.zip (AVION2.exe, AVION2-Updater.exe, licenses) and SHA256SUMS.txt;
# AVION2 finds it via the GitHub API and AVION2-Updater installs it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag, for the release notes

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag '$tag' is not vMAJOR.MINOR.PATCH" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/Avion2.Tests -c Release --filter "Category!=Npcap"

      - name: Publish and zip
        shell: pwsh
        run: ./tools/publish.ps1 -Version ${{ steps.version.outputs.version }} -Zip

      - name: Release notes from the commits since the previous tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($previous) { "$previous..$tag" } else { $tag }
          # One bullet per change: commit subjects list several changes separated by "; "
          $changes = git log --no-merges --pretty=format:%s $range |
            ForEach-Object { $_ -split '; ' } |
            Where-Object { $_.Trim() } |
            ForEach-Object { $t = $_.Trim(); "- " + $t.Substring(0, 1).ToUpper() + $t.Substring(1) }
          $notes = @('## What''s new', '') + $changes + @(
            '',
            '**Updating:** AVION2 shows an "Update now" banner on the home page; one click installs this version.',
            '**New here?** Install [Npcap](https://npcap.com), download the zip below, unzip it and run `AVION2.exe`.')
          if ($previous) { $notes += @('', "Changes since $previous: https://github.com/${{ github.repository }}/compare/$previous...$tag") }
          $notes -join "`n" | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          gh release create '${{ github.ref_name }}' "artifacts/AVION2-v$v-win-x64.zip" artifacts/SHA256SUMS.txt `
            --title "AVION2 ${{ github.ref_name }}" --notes-file release-notes.md
