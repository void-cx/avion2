name: Pages

# The website (site/) on GitHub Pages, with the protocol wiki built from docs/PROTOCOL.md and the changelog from the
# GitHub releases
on:
  push:
    branches: [main]
    paths: [site/**, docs/PROTOCOL.md, tools/build_wiki.py, tools/build_changelog.py, tools/build_seo.py, .github/workflows/pages.yml]
  release:
    types: [published, edited] # the changelog is built from the releases
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Only main may deploy to Pages: a published or edited release (which runs on its tag) rebuilds main instead
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the wiki shows when the notes last changed
      - name: Protocol wiki
        run: |
          python3 -m venv "$RUNNER_TEMP/wiki"
          "$RUNNER_TEMP/wiki/bin/pip" install --quiet markdown==3.7
          "$RUNNER_TEMP/wiki/bin/python" tools/build_wiki.py
      - name: Changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/wiki/bin/python" tools/build_changelog.py'
      - name: Search engines (site address, sitemap, robots.txt, checks)
        run: '"$RUNNER_TEMP/wiki/bin/python" tools/build_seo.py'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
